version: 2

updates:
  - package-ecosystem: pip
    directories:
      - /
      - /configuration-operations
      - /infrastructure-operations
      - /examples/basic-release
      - /examples/companion-release
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: Etc/UTC
    versioning-strategy: increase
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: Etc/UTC
