name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
      - run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -e . pytest ruff mypy pyright build
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy atlas
      - run: pyright
      - run: python -m build
      - name: Build and verify signed sample bundle
        env:
          ATLAS_ETC_DIR: ${{ github.workspace }}/.ci/etc/atlas
        run: |
          set -euxo pipefail
          mkdir -p .ci/release/packs/sample/bin "${ATLAS_ETC_DIR}/trust.d" .ci/minisign
          cat > .ci/release/packs/sample/bin/hello <<'SH'
          #!/usr/bin/env bash
          # atlas: name=hello
          # atlas: timeout=60
          # atlas: allowed_roles=sample
          echo hello
          SH
          chmod +x .ci/release/packs/sample/bin/hello
          minisign -G -p .ci/minisign/atlas-release.pub -s .ci/minisign/atlas-release.key -W
          cp .ci/minisign/atlas-release.pub "${ATLAS_ETC_DIR}/trust.d/atlas-release.pub"
          atlas build .ci/release .ci/sample.bundle --sign --secret-key .ci/minisign/atlas-release.key
          atlas verify-bundle .ci/sample.bundle
