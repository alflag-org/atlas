name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install build
      - run: pytest -q
      - run: ruff check src tests
      - run: python -m build
      - name: Smoke test vNext commands
        env:
          ATLAS_HOME: ${{ github.workspace }}/.ci/opt/atlas
          ATLAS_ETC_DIR: ${{ github.workspace }}/.ci/etc/atlas
          ATLAS_VAR_DIR: ${{ github.workspace }}/.ci/var/lib/atlas
          ATLAS_RUNTIME_DIR: ${{ github.workspace }}/.ci/opt/atlas/runtime
          ATLAS_SCRIPTS_DIR: ${{ github.workspace }}/.ci/opt/atlas/scripts/current
        run: |
          set -euxo pipefail
          mkdir -p "$ATLAS_ETC_DIR"
          cat > "$ATLAS_ETC_DIR/host.yml" <<'H'
          name: ci-host
          site: ci
          zone: mgmt
          role: test
          environment: ci
          runtime_kind: vm
          tags:
            - ci
          H
          cat > "$ATLAS_ETC_DIR/config.yml" <<'C'
          runtime:
            python:
              version: "3.12"
          scripts:
            source: "file://examples/scripts-release"
            auto_update: false
          C
          atlas scripts install examples/scripts-release
          atlas scripts list
          atlas which sample
          atlas which group-nested-sample
          atlas run sample hello --name=takuya
          atlas run group-nested-sample show-context
