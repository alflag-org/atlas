name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          set -euxo pipefail
          python -m pip install --upgrade pip==26.2
          python -m pip install \
            -e '.[dev]' \
            -r operations/requirements.txt \
            -r examples/basic-release/requirements.txt \
            -r examples/companion-release/requirements.txt
          python -m pip check
      - name: Configure the selected Python as the CI runtime provider
        run: |
          ci_python="$(python -c 'import sys; print(sys.executable)')"
          echo "ATLAS_CI_PYTHON=$ci_python" >> "$GITHUB_ENV"
          echo "ATLAS_CI_PYTHON_VERSION=${{ matrix.python-version }}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/atlas-bin"
          cat > "$RUNNER_TEMP/atlas-bin/pyenv" <<'PYENV'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            install)
              [[ "${2:-}" == "-s" && "${3:-}" == "$ATLAS_CI_PYTHON_VERSION" ]]
              exit 0
              ;;
            prefix)
              [[ "${2:-}" == "$ATLAS_CI_PYTHON_VERSION" ]]
              exec "$ATLAS_CI_PYTHON" -c 'from pathlib import Path; import sys; print(Path(sys.executable).parent.parent)'
              ;;
            *)
              echo "unsupported CI pyenv operation" >&2
              exit 2
              ;;
          esac
          PYENV
          chmod +x "$RUNNER_TEMP/atlas-bin/pyenv"
          echo "$RUNNER_TEMP/atlas-bin" >> "$GITHUB_PATH"
      - name: Validate Ansible fixture
        working-directory: tests/fixtures/provisioning
        run: ansible-playbook --syntax-check playbooks/site.yml
      - run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - run: >-
          ruff check src operations tests
      - run: python -m build
      - if: matrix.python-version == '3.14'
        run: make clean-docs html SPHINXOPTS=-W
      - name: Smoke test final release commands
        env:
          ATLAS_HOME: ${{ github.workspace }}/.ci/opt/atlas
          ATLAS_ETC_DIR: ${{ github.workspace }}/.ci/etc/atlas
          ATLAS_VAR_DIR: ${{ github.workspace }}/.ci/var/lib/atlas
          ATLAS_RUNTIME_DIR: ${{ github.workspace }}/.ci/opt/atlas/runtime
        run: |
          set -euxo pipefail
          mkdir -p "$ATLAS_ETC_DIR"
          cat > "$ATLAS_ETC_DIR/host.yml" <<'H'
          name: ci-host
          site: ci
          zone: mgmt
          role: test
          environment: ci
          runtime_kind: vm
          tags:
            - ci
          H
          cat > "$ATLAS_ETC_DIR/config.yml" <<'C'
          runtime:
            python:
              version: "${{ matrix.python-version }}"
          releases:
            sample:
              source: "file://examples/basic-release"
          C
          atlas release install examples/basic-release
          atlas release install operations
          atlas release list
          atlas command list
          diff -u \
            <(printf '%s\n' \
              atlas-ansible hostctl imagectl \
              group-nested-sample sample) \
            <(atlas command list)
          atlas which sample
          atlas which group-nested-sample
          atlas run sample hello --name=ci-user
          atlas run group-nested-sample show-context
          atlas which hostctl
          atlas which atlas-ansible
          atlas which imagectl
          atlas job list operations
          "$ATLAS_HOME/shims/atlas-ansible" --help
          "$ATLAS_HOME/shims/hostctl" --help
          "$ATLAS_HOME/shims/imagectl" --help

  container:
    needs: test-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target runtime --tag atlas-runtime-ci .
      - run: docker run --rm atlas-runtime-ci
