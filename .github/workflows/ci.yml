name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/python/pyproject.toml
      - name: Install Perl environment and XS build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes liblocal-lib-perl libperl-dev build-essential
      - run: |
          set -euxo pipefail
          python -m pip install --upgrade pip==26.2
          python -m pip install -e './src/python[dev,secrets]'
          python -m pip check
      - run: |
          cd src/python && python -m coverage run -m pytest -q
          python -m coverage report
      - run: cd src/python && ruff check atlas atlas_core tests examples
      - run: python -m build src/python
      - run: cd src/perl && perl Makefile.PL && make test dist && prove -v integration/atlas.t
      - if: matrix.python-version == '3.14'
        run: make clean-docs html SPHINXOPTS=-W
      - name: Smoke test local programs
        env:
          ATLAS_HOME: ${{ github.workspace }}/.ci/opt/atlas
          ATLAS_ETC_DIR: ${{ github.workspace }}/.ci/etc/atlas
          ATLAS_VAR_DIR: ${{ github.workspace }}/.ci/var/lib/atlas
          ATLAS_RUNTIMES_DIR: ${{ github.workspace }}/.ci/opt/atlas/runtimes
          ATLAS_ENVIRONMENTS_DIR: ${{ github.workspace }}/.ci/opt/atlas/environments
        run: |
          set -euxo pipefail
          mkdir -p "$ATLAS_ETC_DIR"
          cat > "$ATLAS_ETC_DIR/host.yml" <<'H'
          version: 1
          host:
            id: ci-host
            role: test
            site: ci
          H
          cat > "$ATLAS_ETC_DIR/config.yml" <<C
          runtime:
            python:
              version: "${{ matrix.python-version }}"
              executable: "$(command -v python)"
            perl:
              executable: /usr/bin/perl
          programs:
            basic:
              root: ${{ github.workspace }}/examples/basic-program
              runtime:
                type: python
                environment: basic
            inventory:
              root: ${{ github.workspace }}/examples/perl-program
              runtime:
                type: perl
                environment: inventory
            native:
              root: ${{ github.workspace }}/examples/native-program
              runtime:
                type: native
          C
          atlas runtime install
          atlas env create basic
          "$ATLAS_ENVIRONMENTS_DIR/python/basic/bin/python" -m pip install ./src/python
          atlas env create inventory
          (
            cd src/perl
            perl Makefile.PL INSTALL_BASE="$ATLAS_ENVIRONMENTS_DIR/perl/inventory"
            make pure_install
          )
          atlas command list
          atlas shim generate
          atlas run hello ci-user
          atlas run native-echo from-ci
          atlas run perl-context
          test -s "$ATLAS_VAR_DIR/logs/runs.jsonl"

  container:
    needs: test-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target runtime --tag atlas-runtime-ci .
      - run: docker run --rm atlas-runtime-ci
