name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
      - name: Install development dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - name: Run Ruff
        run: ruff check src tests
      - name: Build package
        run: python -m build
      - name: Smoke test vNext commands
        env:
          ATLAS_HOME: ${{ github.workspace }}/.ci/opt/atlas
          ATLAS_ETC_DIR: ${{ github.workspace }}/.ci/etc/atlas
          ATLAS_VAR_DIR: ${{ github.workspace }}/.ci/var/lib/atlas
          ATLAS_RUNTIME_DIR: ${{ github.workspace }}/.ci/opt/atlas/runtime
          ATLAS_SCRIPTS_DIR: ${{ github.workspace }}/.ci/opt/atlas/scripts/current
        run: |
          set -euxo pipefail
          mkdir -p "$ATLAS_ETC_DIR"
          cat > "$ATLAS_ETC_DIR/host.yml" <<'H'
          name: ci-host
          site: ci
          zone: mgmt
          role: test
          environment: ci
          runtime_kind: vm
          tags:
            - ci
          H
          cat > "$ATLAS_ETC_DIR/config.yml" <<'C'
          runtime:
            python:
              version: "3.11"
          scripts:
            source: "file://examples/basic-scripts-release"
            auto_update: false
          C
          atlas scripts install examples/basic-scripts-release
          python -m venv "$ATLAS_RUNTIME_DIR/python/envs/scripts"
          "$ATLAS_RUNTIME_DIR/python/envs/scripts/bin/python" -m pip install --upgrade pip
          "$ATLAS_RUNTIME_DIR/python/envs/scripts/bin/python" -m pip install fire PyYAML
          atlas scripts list
          atlas which sample
          atlas which group-nested-sample
          atlas run sample hello --name=hoge
          atlas run group-nested-sample show-context
      - name: Lint workflows
        run: actionlint -shellcheck="$(command -v shellcheck)" .github/workflows/*.yml
      - name: Verify mise configuration is unchanged
        run: git diff --exit-code -- mise.toml mise.lock
