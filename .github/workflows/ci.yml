name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - run: ruff check src operations tests
      - run: python -m build
      - name: Smoke test vNext commands
        env:
          ATLAS_HOME: ${{ github.workspace }}/.ci/opt/atlas
          ATLAS_ETC_DIR: ${{ github.workspace }}/.ci/etc/atlas
          ATLAS_VAR_DIR: ${{ github.workspace }}/.ci/var/lib/atlas
          ATLAS_RUNTIME_DIR: ${{ github.workspace }}/.ci/opt/atlas/runtime
        run: |
          set -euxo pipefail
          mkdir -p "$ATLAS_ETC_DIR"
          cat > "$ATLAS_ETC_DIR/host.yml" <<'H'
          name: ci-host
          site: ci
          zone: mgmt
          role: test
          environment: ci
          runtime_kind: vm
          tags:
            - ci
          H
          cat > "$ATLAS_ETC_DIR/config.yml" <<'C'
          runtime:
            python:
              version: "3.11"
          releases:
            basic:
              source: "file://examples/basic-release"
          C
          atlas release install examples/basic-release
          python -m venv "$ATLAS_RUNTIME_DIR/python/envs/scripts"
          "$ATLAS_RUNTIME_DIR/python/envs/scripts/bin/python" -m pip install --upgrade pip
          "$ATLAS_RUNTIME_DIR/python/envs/scripts/bin/python" -m pip install fire PyYAML
          atlas release list
          atlas command list
          atlas which sample
          atlas which nested-sample
          atlas run sample hello --name=hoge
          atlas run nested-sample show-context
