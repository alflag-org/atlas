name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m build
      - name: Package first-party operations release
        run: |
          set -euo pipefail
          operations_version="$(tr -d '\n' < operations/VERSION)"
          git archive \
            --format=tar.gz \
            --output="dist/atlas-operations-${operations_version}.tar.gz" \
            HEAD:operations
      - run: sha256sum dist/* > release-checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*
            release-checksums.txt
