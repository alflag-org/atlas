name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          set -euxo pipefail
          python -m pip install --upgrade pip==26.2
          python -m pip install \
            -e '.[dev]' \
            -r configuration-operations/requirements.txt \
            -r infrastructure-operations/requirements.txt
          python -m pip check
      - run: pytest -q
      - run: python -m build
      - name: Package configuration operations release
        run: |
          set -euo pipefail
          configuration_version="$(tr -d '\n' < configuration-operations/VERSION)"
          git archive \
            --format=tar.gz \
            --output="dist/atlas-configuration-operations-${configuration_version}.tar.gz" \
            HEAD:configuration-operations
      - name: Package infrastructure operations release
        run: |
          set -euo pipefail
          infrastructure_version="$(tr -d '\n' < infrastructure-operations/VERSION)"
          git archive \
            --format=tar.gz \
            --output="dist/atlas-infrastructure-operations-${infrastructure_version}.tar.gz" \
            HEAD:infrastructure-operations
      - run: sha256sum dist/* > release-checksums.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*
            release-checksums.txt
