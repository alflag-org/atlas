schema: atlas.release/v1
name: configuration-operations

commands:
  atlas-ansible:
    runtime: python
    entrypoint: commands/atlas-ansible.py

jobs:
  ansible-syntax-check:
    runtime: python
    entrypoint: jobs/ansible-syntax-check.py
  config-check:
    runtime: python
    entrypoint: jobs/config-check.py
  config-diff:
    runtime: python
    entrypoint: jobs/config-diff.py
  config-apply:
    runtime: python
    entrypoint: jobs/config-apply.py
  inventory-show:
    runtime: python
    entrypoint: jobs/inventory-show.py
  inventory-refresh:
    runtime: python
    entrypoint: jobs/inventory-refresh.py
    default_timeout_seconds: 300

services:
  inventory-refresh:
    job: inventory-refresh
    init:
      systemd:
        service: init/systemd/inventory-refresh.service
        timer: init/systemd/inventory-refresh.timer
