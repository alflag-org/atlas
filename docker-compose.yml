x-atlas-env: &atlas-env
  ATLAS_HOME: /opt/atlas
  ATLAS_ETC_DIR: /etc/atlas
  ATLAS_VAR_DIR: /var/lib/atlas
  ATLAS_RUNTIMES_DIR: /opt/atlas/runtimes
  ATLAS_ENVIRONMENTS_DIR: /opt/atlas/environments

services:
  atlas:
    image: atlas-runtime-local
    build:
      context: .
      target: runtime
    environment: *atlas-env

  check:
    image: atlas-dev-local
    build:
      context: .
      target: dev
    environment: *atlas-env
    command: >
      sh -c "atlas status
      && atlas runtime status
      && atlas run hello docker-check
      && atlas run native-echo docker-check
      && atlas run perl-context
      && cd src/python && ruff check atlas atlas_core tests examples
      && python -m coverage run -m pytest -q
      && python -m coverage report
      && python -m build
      && cd ../perl
      && perl Makefile.PL
      && make test dist
      && prove -v integration/atlas.t"
