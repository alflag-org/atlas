schema: atlas.release/v1
name: host-operations

commands:
  hostctl:
    runtime: python
    entrypoint: commands/hostctl.py

jobs:
  host-registry-reserve:
    runtime: python
    entrypoint: jobs/host-registry-reserve.py
    default_timeout_seconds: 60
  host-provider-allocate:
    runtime: python
    entrypoint: jobs/host-provider-allocate.py
    default_timeout_seconds: 1800
  host-provider-verify:
    runtime: python
    entrypoint: jobs/host-provider-verify.py
    default_timeout_seconds: 300
  host-registry-bind:
    runtime: python
    entrypoint: jobs/host-registry-bind.py
    default_timeout_seconds: 60
  host-wait-ready:
    runtime: python
    entrypoint: jobs/host-wait-ready.py
    default_timeout_seconds: 900
  host-config-bootstrap:
    runtime: python
    entrypoint: jobs/host-config-bootstrap.py
    default_timeout_seconds: 1800
  host-config-converge:
    runtime: python
    entrypoint: jobs/host-config-converge.py
    default_timeout_seconds: 3600
  host-config-verify:
    runtime: python
    entrypoint: jobs/host-config-verify.py
    default_timeout_seconds: 1800
  host-registry-activate:
    runtime: python
    entrypoint: jobs/host-registry-activate.py
    default_timeout_seconds: 60
  host-operation-reconcile:
    runtime: python
    entrypoint: jobs/host-operation-reconcile.py
    default_timeout_seconds: 300
