[tools]
python = "3.12"

[tasks.setup]
description = "Install development dependencies for Atlas"
run = """
python -m pip install --upgrade pip
python -m pip install -e '.[dev]'
"""

[tasks.test]
description = "Run unit tests with 100% coverage enforcement"
run = """
python -m coverage run -m pytest -q
python -m coverage report
"""

[tasks.lint]
description = "Run Ruff checks"
run = "ruff check src operations tests"

[tasks.build]
description = "Build package artifacts"
run = "python -m build"

[tasks.docs]
description = "Build Sphinx documentation"
run = "make html"

[tasks.check]
description = "Run lint, tests, and build"
depends = ["lint", "test", "build"]
