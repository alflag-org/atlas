[tools]
python = "3.14.6"

[tasks.setup]
description = "Install development dependencies for Atlas"
run = """
python -m pip install --upgrade pip==26.2
python -m pip install -e './src/python[dev]'
"""

[tasks.test]
dir = "src/python"
description = "Run unit tests with 100% coverage enforcement"
run = """
python -m coverage run -m pytest -q
python -m coverage report
"""

[tasks.lint]
dir = "src/python"
description = "Run Ruff checks"
run = "ruff check atlas atlas_core tests examples"

[tasks.build]
dir = "src/python"
description = "Build package artifacts"
run = "python -m build"

[tasks.docs]
description = "Build Sphinx documentation"
run = "make html"

[tasks.check]
description = "Run lint, tests, and build"
depends = ["lint", "test", "build"]
