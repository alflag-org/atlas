[tools]
python = "3.12"

[tasks.setup]
description = "Install development dependencies for Atlas"
run = """
python -m pip install --upgrade pip
python -m pip install -e '.[dev]'
python -m pip install build
"""

[tasks.test]
description = "Run unit tests"
run = "pytest -q"

[tasks.lint]
description = "Run Ruff checks"
run = "ruff check src tests"

[tasks.build]
description = "Build package artifacts"
run = "python -m build"

[tasks.check]
description = "Run lint, tests, and build"
depends = ["lint", "test", "build"]
