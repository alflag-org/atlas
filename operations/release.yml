schema: atlas.release/v1
name: operations

commands:
  atlas-ansible:
    target: atlas_configuration_operations.controller:main
  hostctl:
    target: atlas_host_operations.controller:main
  imagectl:
    target: atlas_image_operations.imagectl:main

jobs:
  ansible-syntax-check:
    target: atlas_configuration_operations.ansible_syntax_check:main
  config-check:
    target: atlas_configuration_operations.config_check:main
  config-diff:
    target: atlas_configuration_operations.config_diff:main
  config-apply:
    target: atlas_configuration_operations.config_apply:main
  inventory-show:
    target: atlas_configuration_operations.inventory_show:main
  inventory-refresh:
    target: atlas_configuration_operations.inventory_refresh:main
    default_timeout_seconds: 300
  host-registry-reserve:
    target: atlas_host_operations.controller:host_registry_reserve_main
    default_timeout_seconds: 60
  host-provider-allocate:
    target: atlas_host_operations.controller:host_provider_allocate_main
    default_timeout_seconds: 1800
  host-provider-verify:
    target: atlas_host_operations.controller:host_provider_verify_main
    default_timeout_seconds: 300
  host-registry-bind:
    target: atlas_host_operations.controller:host_registry_bind_main
    default_timeout_seconds: 60
  host-wait-ready:
    target: atlas_host_operations.controller:host_wait_ready_main
    default_timeout_seconds: 900
  host-config-bootstrap:
    target: atlas_host_operations.controller:host_config_bootstrap_main
    default_timeout_seconds: 1800
  host-config-converge:
    target: atlas_host_operations.controller:host_config_converge_main
    default_timeout_seconds: 3600
  host-config-verify:
    target: atlas_host_operations.controller:host_config_verify_main
    default_timeout_seconds: 1800
  host-registry-activate:
    target: atlas_host_operations.controller:host_registry_activate_main
    default_timeout_seconds: 60
  host-operation-reconcile:
    target: atlas_host_operations.controller:reconcile_job_main
    default_timeout_seconds: 300
  vm-create-plan:
    target: atlas_operations.operation.commands:vm_create_plan_main
    default_timeout_seconds: 300
  vm-create-apply:
    target: atlas_operations.operation.commands:vm_create_apply_main
    default_timeout_seconds: 1800
  vm-create-verify:
    target: atlas_operations.operation.commands:vm_create_verify_main
    default_timeout_seconds: 300
  vm-create-rollback:
    target: atlas_operations.operation.commands:vm_create_rollback_main
    default_timeout_seconds: 1800
  vm-template-create-plan:
    target: atlas_operations.operation.commands:vm_template_create_plan_main
    default_timeout_seconds: 300
  vm-template-create-apply:
    target: atlas_operations.operation.commands:vm_template_create_apply_main
    default_timeout_seconds: 1800
  vm-template-create-verify:
    target: atlas_operations.operation.commands:vm_template_create_verify_main
    default_timeout_seconds: 300
  vm-template-create-rollback:
    target: atlas_operations.operation.commands:vm_template_create_rollback_main
    default_timeout_seconds: 1800

services:
  inventory-refresh:
    job: inventory-refresh
    init:
      systemd:
        service: init/systemd/inventory-refresh.service
        timer: init/systemd/inventory-refresh.timer
