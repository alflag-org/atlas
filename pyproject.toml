[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
scripts = [
  "fire>=0.7",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.6",
  "fire>=0.7",
  "sphinx>=8.1",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "atlas",
  "atlas.*",
  "atlas_core",
  "atlas_core.*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
